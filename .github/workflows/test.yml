name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  json-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Example policy
        run: pipx run --spec aegis-devops==1.2.0 aegis init .aegis

      - name: Allowed plan
        id: allow
        uses: ./
        with:
          plan: tests/plans/allow.json
          comment: "false"

      - name: Plan blocked by a plan-level rule
        id: block
        continue-on-error: true
        uses: ./
        with:
          plan: tests/plans/block-db-delete.json

      - name: Large plan escalates but passes with fail-on block
        id: escalate
        uses: ./
        with:
          plan: tests/plans/escalate-large.json
          comment: "false"

      - name: Assert results
        env:
          ALLOW: ${{ steps.allow.outputs.verdict }}
          BLOCK: ${{ steps.block.outputs.verdict }}
          BLOCK_OUTCOME: ${{ steps.block.outcome }}
          BLOCK_CITES: ${{ steps.block.outputs.citations }}
          ESCALATE: ${{ steps.escalate.outputs.verdict }}
        run: |
          set -x
          test "$ALLOW" = ALLOW
          test "$BLOCK" = BLOCK
          test "$BLOCK_OUTCOME" = failure
          test "$BLOCK_CITES" = plan-no-db-deletes
          test "$ESCALATE" = ESCALATE

  binary-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Example policy
        run: pipx run --spec aegis-devops==1.2.0 aegis init .aegis

      - name: Terraform plan
        working-directory: tests/tf
        run: terraform init -input=false && terraform plan -input=false -out=tfplan

      - name: Check the binary plan
        id: check
        uses: ./
        with:
          plan: tfplan
          working-directory: tests/tf
          config-dir: ../../.aegis
          comment: "false"

      - name: Assert result
        run: test "${{ steps.check.outputs.verdict }}" = ALLOW

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Example policy with a signed budget
        run: |
          pipx run --spec aegis-devops==1.2.0 aegis init .aegis
          printf 'principal: admin\nunit: tokens\nsession: {limit: 1000}\nproject_day: {limit: 100000}\n' > .aegis/budget.yaml
          pipx run --spec aegis-devops==1.2.0 aegis sign --key file:.aegis/example-signing.key .aegis/budget.yaml

      - name: Budget setup
        id: setup
        uses: ./
        with:
          budget: setup
          agents: claude,codex

      - name: Stand-in for an agent run (a Claude Code session over the limit, then one tool call)
        id: agent
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          log="$HOME/.claude/projects/-ws/s1.jsonl"
          mkdir -p "$(dirname "$log")"
          printf '{"type":"user","sessionId":"s1","cwd":"%s","timestamp":"%s"}\n' "$PWD" "$now" > "$log"
          printf '{"type":"assistant","sessionId":"s1","requestId":"r","timestamp":"%s","message":{"id":"m","model":"claude-opus-5-5","usage":{"input_tokens":5000,"output_tokens":10}}}\n' "$now" >> "$log"
          jq -e '.hooks.PreToolUse[0].matcher == "*" and (.hooks.UserPromptSubmit | length) == 1' "$HOME/.claude/settings.json"
          payload="$(jq -nc --arg cwd "$PWD" --arg t "$log" '{session_id:"s1",cwd:$cwd,tool_name:"Edit",tool_input:{},transcript_path:$t}')"
          set +e
          printf '%s' "$payload" | "$RUNNER_TEMP/aegis-venv/bin/aegis" hook claude
          echo "hook=$?" >> "$GITHUB_OUTPUT"

      - name: Budget report (over the limit, fails)
        id: report
        if: always()
        continue-on-error: true
        uses: ./
        with:
          budget: report

      - name: Budget report (fail-on never)
        id: report-never
        uses: ./
        with:
          budget: report
          fail-on: never
          comment: "false"

      - name: Assert results
        env:
          SETUP: ${{ steps.setup.outputs.budget-decision }}
          HOOK: ${{ steps.agent.outputs.hook }}
          REPORT: ${{ steps.report.outputs.budget-decision }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          NEVER: ${{ steps.report-never.outputs.budget-decision }}
          STATUS: ${{ steps.report-never.outputs.budget-status }}
        run: |
          set -x
          test "$SETUP" = allow
          test "$HOOK" = 2
          test "$REPORT" = deny
          test "$REPORT_OUTCOME" = failure
          test "$NEVER" = deny
          jq -e '.sessions[0].level == "deny"' "$STATUS"

  budget-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Example policy without a budget
        run: pipx run --spec aegis-devops==1.2.0 aegis init .aegis

      - name: Budget setup without budget.yaml fails
        id: setup
        continue-on-error: true
        uses: ./
        with:
          budget: setup

      - name: Assert
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          DECISION: ${{ steps.setup.outputs.budget-decision }}
        run: test "$OUTCOME" = failure && test "$DECISION" = error

  budget-subdir:
    # The policy lives in a subdirectory (working-directory is applied once, by the step) and
    # the key arrives only through `signing-key` (passed to aegis in its environment).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Policy in sub/, signed budget, example key moved out of the policy directory
        id: policy
        run: |
          set -euo pipefail
          mkdir sub && cd sub
          pipx run --spec aegis-devops==1.2.0 aegis init .aegis
          printf 'principal: admin\nunit: tokens\nsession: {limit: 1000}\nproject_day: {limit: 100000}\n' > .aegis/budget.yaml
          pipx run --spec aegis-devops==1.2.0 aegis sign --key file:.aegis/example-signing.key .aegis/budget.yaml
          echo "key=$(grep -v '^#' .aegis/example-signing.key | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          mv .aegis/example-signing.key "$RUNNER_TEMP/"

      - name: Budget setup in sub/
        id: setup
        uses: ./
        with:
          budget: setup
          working-directory: sub
          signing-key: ${{ steps.policy.outputs.key }}

      - name: Budget report in sub/
        id: report
        uses: ./
        with:
          budget: report
          working-directory: sub
          signing-key: ${{ steps.policy.outputs.key }}
          comment: "false"

      - name: Assert
        env:
          SETUP: ${{ steps.setup.outputs.budget-decision }}
          REPORT: ${{ steps.report.outputs.budget-decision }}
          STATUS: ${{ steps.report.outputs.budget-status }}
        run: |
          set -x
          test "$SETUP" = allow
          test "$REPORT" = allow
          jq -e --arg p "$PWD/sub" '.project == $p' "$STATUS"

  budget-escalate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Example policy with a signed budget
        run: |
          pipx run --spec aegis-devops==1.2.0 aegis init .aegis
          printf 'principal: admin\nunit: tokens\nsession: {limit: 1000}\nproject_day: {limit: 100000}\n' > .aegis/budget.yaml
          pipx run --spec aegis-devops==1.2.0 aegis sign --key file:.aegis/example-signing.key .aegis/budget.yaml

      - name: Budget setup with escalate-scripts
        id: setup
        uses: ./
        with:
          budget: setup
          agents: claude,codex
          escalate-scripts: "true"
          aegis-version: "1.2.0"

      - name: The hooks carry --escalate-scripts and stop a script run
        env:
          SETUP: ${{ steps.setup.outputs.budget-decision }}
        run: |
          set -euo pipefail
          test "$SETUP" = allow
          jq -e '.hooks.PreToolUse[0].hooks[0].command | endswith("hook claude -- --escalate-scripts")' "$HOME/.claude/settings.json"
          jq -e '.hooks.PreToolUse[0].hooks[0].command | endswith("hook codex -- --escalate-scripts")' "$HOME/.codex/hooks.json"
          cmd="$(jq -r '.hooks.PreToolUse[0].hooks[0].command' "$HOME/.claude/settings.json")"
          payload="$(jq -nc --arg cwd "$PWD" '{session_id:"s1",cwd:$cwd,tool_name:"Bash",tool_input:{command:"bash nuke.sh"}}')"
          out="$(printf '%s' "$payload" | eval "$cmd")"
          echo "$out"
          echo "$out" | jq -e '.hookSpecificOutput.permissionDecision == "ask"'

  budget-escalate-scripts-old-aegis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Example policy with a signed budget
        run: |
          pipx run --spec aegis-devops==1.1.0 aegis init .aegis
          printf 'principal: admin\nunit: tokens\nsession: {limit: 1000}\nproject_day: {limit: 100000}\n' > .aegis/budget.yaml
          pipx run --spec aegis-devops==1.1.0 aegis sign --key file:.aegis/example-signing.key .aegis/budget.yaml

      - name: escalate-scripts with aegis-devops 1.1.0 (fails with a clear message)
        id: setup
        continue-on-error: true
        uses: ./
        with:
          budget: setup
          escalate-scripts: "true"
          aegis-version: "1.1.0"

      - name: Assert it failed, saying which version is needed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          DECISION: ${{ steps.setup.outputs.budget-decision }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$DECISION" = error
          # the same setup again, with the 1.1.0 the step installed, to read its message
          out="$(AEGIS_BIN="$RUNNER_TEMP/aegis-venv/bin/aegis" INPUT_BUDGET=setup INPUT_AGENTS=claude \
            INPUT_ESCALATE_SCRIPTS=true GITHUB_OUTPUT=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
            "$RUNNER_TEMP/aegis-venv/bin/python" "$GITHUB_WORKSPACE/aegis_budget.py" 2>&1 || true)"
          echo "$out"
          grep -q "needs aegis-devops 1.2.0 or later" <<<"$out"
