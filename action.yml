name: Aegis-DevOps Plan Check
description: Check a Terraform or OpenTofu plan against signed, authority-checked policy before it is applied; cap what coding agents spend in a workflow
author: Vamshidher Reddy Jannapu Reddy
branding:
  icon: shield
  color: green

inputs:
  plan:
    description: >
      Path to the plan. A JSON plan (from `terraform show -json tfplan`) is checked as is.
      A binary plan file is converted with `<tool> show -json` first, which needs the tool on
      PATH and an initialised working directory. Required unless `budget` is `setup` or
      `report`.
    required: false
    default: ""
  tool:
    description: "`terraform` or `tofu`. Selects the plan schema label and the binary used to convert a binary plan."
    required: false
    default: terraform
  working-directory:
    description: Directory to run in. Relative `plan` and `config-dir` paths resolve from here.
    required: false
    default: .
  config-dir:
    description: >
      Policy directory (as created by `aegis init .aegis`). Empty means Aegis's own search order:
      $AEGIS_CONFIG_DIR, then ./.aegis, then ~/.config/aegis.
    required: false
    default: ""
  fail-on:
    description: "When to fail the step: `block` (default), `escalate` (ESCALATE or BLOCK), or `never` (report only)."
    required: false
    default: block
  comment:
    description: >
      Post the result as a pull request comment, updated in place on later runs. Needs
      `pull-requests: write`. A missing permission only produces a warning.
    required: false
    default: "true"
  signing-key:
    description: >
      Key your policy files are signed with. Pass it from a repository secret. Empty means Aegis's default: $AEGIS_SIGNING_KEY, then the
      example key that `aegis init` writes next to the example policy.
    required: false
    default: ""
  github-token:
    description: Token used for the pull request comment.
    required: false
    default: ${{ github.token }}
  aegis-version:
    description: Version of the aegis-devops package to install from PyPI.
    required: false
    default: "1.1.0"
  budget:
    description: >
      The session budget cap for coding agents run in this job. `off` (default) checks a plan.
      `setup`, before the step that runs an agent: checks that the policy directory holds a
      usable signed budget.yaml and installs aegis's hooks for `agents` in the runner's home
      directory. `report`, after it (with `if: always()`): totals the agents' sessions from
      their logs, writes the job summary (and a pull request comment), and fails per `fail-on`
      (`block`: a limit was reached; `escalate`: also near one).
    required: false
    default: "off"
  agents:
    description: "With `budget: setup`: comma-separated agents to install the budget hooks for: claude, codex, gemini, opencode, copilot."
    required: false
    default: claude
  escalate-scripts:
    description: >
      With `budget: setup` (ignored otherwise): `true` installs the hooks with aegis's
      `--escalate-scripts`, so a
      command that runs code aegis cannot read (a script file, `make` or `npm run`, inline or
      piped code) is escalated: Codex, Gemini CLI and OpenCode block it; Claude Code and
      Copilot CLI get an "ask", which is not guaranteed to block in a headless run. Needs
      aegis-devops 1.2.0 or later (set `aegis-version`). Default `false`.
    required: false
    default: "false"
  python-version:
    description: Python version to run Aegis with (3.11 or later).
    required: false
    default: "3.12"

outputs:
  verdict:
    description: "Plan verdict: ALLOW, ESCALATE or BLOCK (ERROR if Aegis could not decide)."
    value: ${{ steps.check.outputs.verdict }}
  citations:
    description: Comma-separated IDs of the policy rules that decided the verdict.
    value: ${{ steps.check.outputs.citations }}
  report:
    description: Path to the full JSON-lines report from `aegis check`.
    value: ${{ steps.check.outputs.report }}
  budget-decision:
    description: "With `budget`: allow, warn or deny (error if the budget could not be read)."
    value: ${{ steps.budget.outputs.budget-decision }}
  budget-status:
    description: "With `budget: report`: path to the JSON from `aegis budget status`."
    value: ${{ steps.budget.outputs.budget-status }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
      id: python

    - name: Install aegis-devops
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        AEGIS_VERSION: ${{ inputs.aegis-version }}
      run: |
        set -euo pipefail
        "$PYTHON" -m venv "$RUNNER_TEMP/aegis-venv"
        "$RUNNER_TEMP/aegis-venv/bin/python" -m pip install --quiet --disable-pip-version-check "aegis-devops==${AEGIS_VERSION}"
        "$RUNNER_TEMP/aegis-venv/bin/python" -c "import aegis_core; print('aegis-devops', aegis_core.__version__)"

    - name: Check plan
      id: check
      if: inputs.budget == 'off' || inputs.budget == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AEGIS_BIN: ${{ runner.temp }}/aegis-venv/bin/aegis
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_TOOL: ${{ inputs.tool }}
        INPUT_CONFIG_DIR: ${{ inputs.config-dir }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SIGNING_KEY: ${{ inputs.signing-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$RUNNER_TEMP/aegis-venv/bin/python" "$GITHUB_ACTION_PATH/aegis_action.py"'

    - name: Budget
      id: budget
      if: inputs.budget != 'off' && inputs.budget != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AEGIS_BIN: ${{ runner.temp }}/aegis-venv/bin/aegis
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_AGENTS: ${{ inputs.agents }}
        INPUT_ESCALATE_SCRIPTS: ${{ inputs.escalate-scripts }}
        INPUT_CONFIG_DIR: ${{ inputs.config-dir }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SIGNING_KEY: ${{ inputs.signing-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$RUNNER_TEMP/aegis-venv/bin/python" "$GITHUB_ACTION_PATH/aegis_budget.py"'
